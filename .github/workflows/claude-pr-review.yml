            and (
              .review.merit_disagreements
              | type == "number" and floor == . and . >= 0 and . <= 49
            )
            and .review.merit_confirmations == .review.merit_disagreements
            and (.review.interface_ledger_sha256 | test("^[0-9a-f]{64}$"))
