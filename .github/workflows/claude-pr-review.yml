          # discards a JSON string "false", a number, a null, or a missing
          # field, none of which -r alone could tell apart from the real
          # boolean once rendered. `tostring` then turns the surviving boolean
          # into "true"/"false", which -r prints and which is never falsy to
          # the shell. What jq no longer does is signal that rejection through
          # an exit status that `false` also produces; the shell case below
          # sees an empty value instead and says so.
          partial_coverage="$(jq -r '
            .review.partial_coverage | select(type == "boolean") | tostring
          ' "$response_manifest")"
          case "$partial_coverage" in
            true|false) ;;
            *)
              printf 'Adversarial review publication failed assertion: review.partial_coverage is not a boolean (partial_coverage_bytes=%s)\n' \
                "${#partial_coverage}" >&2
              exit 1
              ;;
          esac
          evidence="$(jq -cn \
            --argjson partial_coverage "$partial_coverage" \
            --arg repository "$GITHUB_REPOSITORY" \
            --argjson pull_request "$PR_NUMBER" \
            --arg base_ref "$EXPECTED_BASE_REF" \
            --arg base_sha "$EXPECTED_BASE_SHA" \
            --argjson chunk_count "$EXPECTED_CHUNK_COUNT" \
            --arg chunk_manifest_sha256 "$EXPECTED_CHUNK_MANIFEST_SHA256" \
            --arg compaction_manifest_sha256 "$EXPECTED_COMPACTION_MANIFEST_SHA256" \
            --arg exact_diff_sha256 "$EXPECTED_DIFF_SHA256" \
            --arg head_sha "$EXPECTED_HEAD_SHA" \
            --arg merge_tree_sha "$EXPECTED_MERGE_TREE_SHA" \
            --arg model "$EXPECTED_MODEL" \
            --arg review_representation_sha256 "$EXPECTED_REPRESENTATION_SHA256" \
            --arg response_manifest_b64 "$EXPECTED_RESPONSE_MANIFEST_B64" \
            --arg response_manifest_sha256 "$EXPECTED_RESPONSE_MANIFEST_SHA256" \
            --arg workflow_sha256 "$EXPECTED_WORKFLOW_SHA256" \
            --argjson run_id "$GITHUB_RUN_ID" \
            --argjson run_attempt "$GITHUB_RUN_ATTEMPT" '
            {
              repository: $repository,
              pull_request: $pull_request,
              base_ref: $base_ref,
              base_sha: $base_sha,
              chunk_count: $chunk_count,
              chunk_manifest_sha256: $chunk_manifest_sha256,
              compaction_manifest_sha256: $compaction_manifest_sha256,
              exact_diff_sha256: $exact_diff_sha256,
              head_sha: $head_sha,
              merge_tree_sha: $merge_tree_sha,
              model: $model,
              review_representation_sha256: $review_representation_sha256,
              response_manifest_b64: $response_manifest_b64,
              response_manifest_sha256: $response_manifest_sha256,
              review_protocol: "bounded-diff-chunks-v1",
              workflow_sha256: $workflow_sha256,
              workflow_path: ".github/workflows/claude-pr-review.yml",
              run_id: $run_id,
              run_attempt: $run_attempt,
              verdict: "PASS",
              partial_coverage: $partial_coverage,
              merge_authority: "none"
            }
          ')"
          visible_body=""
          else
          # --- FAIL LANE ------------------------------------------------------
          #
          # No manifest, no digests over model output, and no claim that any
          # exists. What this lane publishes is the reviewer's stated objection,
          # bound to the repository, base, head and workflow digest the run
          # already proved above, so a reader can tell WHICH change was reviewed.
          #
          # The objection is decoded from a base64 step output and then filtered
          # AGAIN to printable ASCII plus newline. The producing step already
          # bounded the alphabet; re-filtering here is the consumer declining to
          # inherit trust across a process boundary. Redaction over omission: a
          # stray byte is dropped, the rest of the objection is still published.
          [[ "$OBJECTION_B64" =~ ^[A-Za-z0-9+/]+={0,2}$ ]]
          test "${#OBJECTION_B64}" -le 60000
          objection_file="$RUNNER_TEMP/published-objection.txt"
          printf '%s' "$OBJECTION_B64" | base64 -d \
            | head -c 8192 | tr -cd '\11\12\40-\176' > "$objection_file"
          test -s "$objection_file"
          objection="$(cat "$objection_file")"
          # THE HIDDEN COMMENT IS AN HTML COMMENT, AND `-->` ENDS ONE.
          #
          # The objection rode into the evidence JSON as raw text. JSON escaping
          # does not touch `-->`, and the JSON is then wrapped in `<!-- ... -->`,
          # so a rationale or chunk summary containing `-->` terminated the
          # comment early and everything after it rendered as live Markdown in a
          # comment authored by the trusted Actions account. The alphabet
          # permits `-` and `>`, so this was reachable from model output.
          #
          # Carried base64 instead. That is not an escape that has to be right
          # for every delimiter anyone might add later -- it is a construction in
          # which no delimiter can appear at all, and it matches how the PASS
          # lane already carries its response manifest. The human-readable copy
          # lives in the VISIBLE body below, where a code fence is the correct
          # containment and the reader can actually see it.
          # Named to differ from the OBJECTION_B64 env var in more than case.
          # A lowercase twin of an env name reads to the linter as a probable
          # misspelling (SC2153), and a standing lint note in a security
          # workflow is a thing reviewers learn to skip past.
          #
          # NOTE: a comment line here must never BEGIN with the linter's name --
          # that is how it spells a directive, and an English sentence in that
          # position is parsed as one and fails the run (SC1072/SC1073).
          published_objection_b64="$(base64 -w0 "$objection_file")"
          evidence="$(jq -cn \
            --arg repository "$GITHUB_REPOSITORY" \
            --argjson pull_request "$PR_NUMBER" \
            --arg base_ref "$EXPECTED_BASE_REF" \
            --arg base_sha "$EXPECTED_BASE_SHA" \
            --arg head_sha "$EXPECTED_HEAD_SHA" \
            --arg model "$EXPECTED_MODEL" \
            --arg workflow_sha256 "$EXPECTED_WORKFLOW_SHA256" \
            --arg failure_stage "$FAILURE_STAGE" \
            --arg objection_b64 "$published_objection_b64" \
            --argjson run_id "$GITHUB_RUN_ID" \
            --argjson run_attempt "$GITHUB_RUN_ATTEMPT" '
            {
              repository: $repository,
              pull_request: $pull_request,
              base_ref: $base_ref,
              base_sha: $base_sha,
              head_sha: $head_sha,
              model: $model,
              review_protocol: "bounded-diff-chunks-v1",
              workflow_sha256: $workflow_sha256,
              workflow_path: ".github/workflows/claude-pr-review.yml",
              run_id: $run_id,
              run_attempt: $run_attempt,
              verdict: "FAIL",
              failure_stage: $failure_stage,
              objection_b64: $objection_b64,
              merge_authority: "none"
            }
          ')"
          # A FAIL comment that is only a hidden HTML comment defeats the entire
          # purpose: the operator has to VIEW it. The PASS lane stays hidden --
          # a clean review should not add noise to every pull request -- and the
          # FAIL lane renders.
          # SEPARATE STEP, SEPARATE SHELL, SO ITS OWN COPY. This is
          # byte-identical to the definition in the model step and
          # tests/test_canonical_pr_review_hardening.py asserts that it
          # stays so -- two fence calculators that disagreed would mean the
          # step summary and the published comment escape differently.
          markdown_fence() {
            local file="$1"
            local longest
            # Longest run of consecutive backticks anywhere in the file, 0 if
            # none. ONE awk pass, and deliberately NOT `grep -o ... | awk`:
            # grep exits 1 when it finds nothing, which here is the ORDINARY
            # case (most rationales contain no backtick at all), and under the
            # step's `set -o pipefail` that turns a clean objection into a dead
            # step. awk always exits 0, so the common case cannot fail.
            longest="$(awk '{
              run = 0
              for (i = 1; i <= length($0); i++) {
                if (substr($0, i, 1) == "`") {
                  run++
                  if (run > max) max = run
                } else {
                  run = 0
                }
              }
            } END { print max + 0 }' "$file")"
            [ -n "$longest" ] || longest=0
            local width=3
            if [ "$longest" -ge 3 ]; then
              width=$((longest + 1))
            fi
            printf '%*s' "$width" '' | tr ' ' '`'
          }

          # The visible body is Markdown, so the objection goes in a fence wide
          # enough that nothing inside it can close the fence. See
          # markdown_fence: a rationale containing ``` used to close this block
          # and render the remainder as active Markdown from a trusted account.
          objection_fence="$(markdown_fence "$objection_file")"
          # A FAIL comment that is only a hidden HTML comment defeats the entire
          # purpose: the operator has to VIEW it. The PASS lane stays hidden --
          # a clean review should not add noise to every pull request -- and the
          # FAIL lane renders.
          #
          # NO TRAILING GLOSS. This used to end with an unconditional sentence
          # about "every chunk passing while the synthesis fails", which was
          # simply FALSE whenever chunks had dissented -- and it contradicted the
          # dissent count printed a few lines above it in the objection itself.
          # The objection is generated where chunk_merit_failures is known and
          # already says the right thing for the case at hand, so restating a
          # paraphrase here could only ever disagree with it. One source of
          # truth; the duplicate is deleted rather than made conditional.
          visible_body="$(printf '%s\n\n%s\n%s\n\n%s\n%s\n%s\n\n' \
            '### Adversarial review: FAIL' \
            'The reviewer read this change and objected. This comment is **advisory** and confers **no merge authority**; it is evidence, not a decision.' \
            "Reviewed head \`${EXPECTED_HEAD_SHA}\` against base \`${EXPECTED_BASE_REF}\`, model \`${EXPECTED_MODEL}\`, [run](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})." \
            "$objection_fence" \
            "$objection" \
            "$objection_fence")"
          fi
          pending_evidence="$(jq -c '.verdict = "PENDING"' <<<"$evidence")"
          pending_body="<!-- claude-review-evidence:v3 ${pending_evidence} -->"
          # `pass_body` is the FINAL body of EITHER lane, not just the PASS one.
          # The name is kept deliberately. scripts/fleet-autonomy.sh pins the
          # call site that patches this variable as the point after which the
          # kill switch must already have been rechecked; renaming the variable
          # would silently disarm that ordering check in the fleet distributor,
          # and the gate is worth more than the tidier identifier. For the same
          # reason nothing above may repeat that call site's exact text -- the
          # distributor locates it by first occurrence.
          # THE SEPARATOR IS LOAD-BEARING, and its absence was a real defect.
          #
          # `visible_body` is built with a command substitution, and those STRIP
          # trailing newlines -- so the string ends at the closing fence with no
          # newline after it, and concatenating the hidden comment directly
          # produced a final line reading "````<!-- claude-review-evidence...".
          # A CommonMark closing fence may not carry trailing text, so that line
          # closed nothing: the code block ran to the end of the comment and the
          # entire hidden evidence payload rendered as visible code.
          #
          # Added only when there IS a visible body, so the PASS comment stays
          # byte-for-byte what it has always been.
          visible_separator=""
          [ -z "$visible_body" ] || visible_separator=$'\n\n'
          pass_body="${visible_body}${visible_separator}<!-- claude-review-evidence:v3 ${evidence} -->"
          test "$(printf '%s' "$pending_body" | wc -c)" -le 65536
          test "$(printf '%s' "$pass_body" | wc -c)" -le 65536
          # THE COMMENT BOUNDARY IS ASSERTED, NOT ASSUMED.
          #
          # Base64-carrying the objection removes the only field a model can
          # write into the hidden comment, so `-->` should now be unreachable
          # there. "Should be" is what the previous version of this code also
          # believed. This is the cheap, direct check of the actual property --
          # it holds for BOTH lanes, it costs one grep, and it fails closed on
          # any future field that reintroduces the vector. It deliberately does
          # not try to sanitise: if the invariant is broken, publishing a
          # half-escaped comment is worse than publishing none.
          for boundary_checked in "$pending_evidence" "$evidence"; do
            case "$boundary_checked" in
              *'-->'*)
                echo "Adversarial review publication failed assertion: evidence JSON contains an HTML comment terminator" >&2
                exit 1
                ;;
            esac
          done

          bounded_gh() {
            timeout --kill-after=5s 20s gh api "$@"
          }

          validate_live_controls() {
            local phase="$1"
            local pr_file="$RUNNER_TEMP/${phase}-pull-request.json"
            local ref_file="$RUNNER_TEMP/${phase}-protected-ref.json"
            local run_file="$RUNNER_TEMP/${phase}-workflow-run.json"
            local state head_ref
            bounded_gh "/repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" \
              > "$pr_file"
            # As in the source step: the pull request object's base.sha is the
            # frozen event value, never the live default branch head, so the
            # base is bound on the protected ref immediately below instead.
            jq -e \
              --arg repository "$GITHUB_REPOSITORY" \
              --arg base_ref "$EXPECTED_BASE_REF" \
              --arg head "$EXPECTED_HEAD_SHA" '
              .state == "open"
              and .draft == false
              and .base.ref == $base_ref
              and .base.ref == .base.repo.default_branch
              and .head.repo.full_name == $repository
              and .head.sha == $head
              and all(.labels[]; .name != "do-not-merge")
            ' "$pr_file" >/dev/null
            # Taken from the pull request object the gate above just bound to
            # this exact repository, base, and head.
            head_ref="$(jq -er .head.ref "$pr_file")"
            test -n "$head_ref"
            bounded_gh \
              "/repos/${GITHUB_REPOSITORY}/git/ref/heads/${EXPECTED_BASE_REF}" \
              > "$ref_file"
            jq -e \
              --arg ref "refs/heads/${EXPECTED_BASE_REF}" \
              --arg base "$EXPECTED_BASE_SHA" '
              .ref == $ref
              and .object.type == "commit"
              and .object.sha == $base
            ' "$ref_file" >/dev/null
            bounded_gh "/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
              > "$run_file"
            # On pull_request_target the Actions API reports the PULL REQUEST's
            # head on the run object -- head_branch is the PR branch and
            # head_sha is the PR head -- never the base the workflow executes
            # from. Binding this run to the base was therefore unsatisfiable on
            # every run. Nothing is lost by binding it to the head instead: the
            # run's executes-from-main integrity is already enforced upstream by
            # `test "$GITHUB_WORKFLOW_SHA" = "$EXPECTED_BASE_SHA"` and the
            # GITHUB_WORKFLOW_REF pin, so this gate binds the run to the head it
            # actually reviewed.
            jq -e \
              --argjson run_id "$GITHUB_RUN_ID" \
              --argjson run_attempt "$GITHUB_RUN_ATTEMPT" \
              --arg head_ref "$head_ref" \
              --arg head "$EXPECTED_HEAD_SHA" '
              .id == $run_id
              and .run_attempt == $run_attempt
              and .event == "pull_request_target"
              and .head_branch == $head_ref
              and .head_sha == $head
              and .path == ".github/workflows/claude-pr-review.yml"
              and .status == "in_progress"
              and .conclusion == null
            ' "$run_file" >/dev/null
            state="$(curl --fail --silent --show-error --location \
              --max-time 15 --retry 2 \
              https://raw.githubusercontent.com/jbutler1980/agent-ops-flags/main/state \
              | tr -d '[:space:]')"
            test "$state" = "on"
          }

          fetch_comment() {
            local output="$1"
            bounded_gh \
              "/repos/${GITHUB_REPOSITORY}/issues/comments/${comment_id}" \
              > "$output"
            test "$(wc -c < "$output")" -le 131072
          }

          validate_comment() {
            local input="$1"
            local expected_body="$2"
            jq -e \
              --argjson id "$comment_id" \
              --arg body "$expected_body" '
              .id == $id and .body == $body
            ' "$input" >/dev/null
          }

          patch_comment() {
            local body="$1"
            local output="$2"
            bounded_gh -X PATCH \
              "/repos/${GITHUB_REPOSITORY}/issues/comments/${comment_id}" \
              -f body="$body" > "$output" \
              && test "$(wc -c < "$output")" -le 131072 \
              && validate_comment "$output" "$body"
          }

          restore_pending() {
            local recovery="$RUNNER_TEMP/restore-pending.json"
            for _ in 1 2 3; do
              if patch_comment "$pending_body" "$recovery"; then
                return 0
              fi
              if fetch_comment "$recovery" \
                && validate_comment "$recovery" "$pending_body"; then
                return 0
              fi
              sleep 1
            done
            return 1
          }

          validate_live_controls pre
          created="$RUNNER_TEMP/pending-comment.json"
          bounded_gh -X POST \
            "/repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
            -f body="$pending_body" > "$created"
          test "$(wc -c < "$created")" -le 131072
          comment_id="$(jq -er .id "$created")"
          [[ "$comment_id" =~ ^[1-9][0-9]*$ ]]
          validate_comment "$created" "$pending_body"

          validate_live_controls publish
          pass_response="$RUNNER_TEMP/pass-comment.json"
          if ! patch_comment "$pass_body" "$pass_response"; then
            recovered="$RUNNER_TEMP/pass-recovery.json"
            fetch_comment "$recovered"
            if validate_comment "$recovered" "$pending_body"; then
              exit 1
            fi
            validate_comment "$recovered" "$pass_body"
          fi

          final_comment="$RUNNER_TEMP/final-comment.json"
          if validate_live_controls final \
            && fetch_comment "$final_comment" \
            && validate_comment "$final_comment" "$pass_body"; then
            exit 0
          fi

          echo "Post-publication validation failed; compensating PASS evidence." >&2
          if restore_pending; then
            exit 1
          fi
          for _ in 1 2 3; do
            if bounded_gh -X DELETE \
              "/repos/${GITHUB_REPOSITORY}/issues/comments/${comment_id}"; then
              exit 1
            fi
            sleep 1
          done
          echo "Unable to confirm compensation or deletion of published PASS evidence." >&2
          exit 1
