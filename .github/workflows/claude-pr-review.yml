          set -euo pipefail
          # --- LANE DISCRIMINATION -------------------------------------------
          #
          # Two lanes reach this step and they publish different things:
          #
          #   PASS -- unchanged. Requires a complete hash-bound response
          #           manifest and revalidates every digest in it from scratch.
          #           This is the lane that produces evidence of a clean review,
          #           so it keeps every check it ever had.
          #
          #   FAIL -- new, and deliberately much smaller. It publishes the
          #           reviewer's stated objection so the operator can read it on
          #           the pull request instead of excavating a red job log. It
          #           carries NO response manifest, asserts NO manifest digest,
          #           and confers NO authority: both lanes stamp the same
          #           none-merge-authority field, and a FAIL comment cannot make
          #           anything mergeable because nothing consumes it as
          #           permission.
          #
          # An unrecognised verdict publishes nothing. The `if:` on the job
          # already restricts entry, but this step re-derives its own lane
          # instead of trusting that a workflow-level expression stayed in sync
          # with it -- the two are edited at different times by different people.
          case "${PUBLISHED_VERDICT:-}" in
            pass) publish_verdict=PASS ;;
            fail) publish_verdict=FAIL ;;
            *)
              echo "Publisher reached with no usable verdict; publishing nothing." >&2
              exit 1
              ;;
