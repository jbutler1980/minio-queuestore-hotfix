          # The FAIL lane exists ONLY for a review that produced a finding about
          # the change: `merit` (the reviewer objected) or `injection` (the
          # reviewed content attacked the reviewer). An availability failure has
          # no finding to publish and must never be dressed as one, so the
          # allowlist is exact and anything outside it publishes nothing.
          if [ "$publish_verdict" = "FAIL" ]; then
            case "${FAILURE_STAGE:-}" in
              merit|injection) ;;
